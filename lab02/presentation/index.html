 if(k<5){const names=['Decision Tree','Random Forest','Gradient Boosting','SVM','KNN'],descs=['Вопрос за вопросом','200 деревьев','Исправляет ошибки','Разделяющая граница','5 ближайших соседей'];names.forEach((name,i)=>{if(i>k)return;let x=79+i*295,part=t(x,281,name,'label')+t(x,666,descs[i],'small');if(i===0)part+=treeIcon(x+20,368,'tree');if(i===1){for(let j=0;j<3;j++)part+=treeIcon(x+14+j*80,400,'forest-'+j,true);part+=t(x+127,578,'200','medium',C.orange,'middle')}if(i===2){for(let j=0;j<3;j++){part+=rect(x+12+j*80,405,61,73,j===2?C.lightTeal:C.paper,6)+t(x+42+j*80,452,j+1,'label',C.ink,'middle');if(j<2)part+=line(x+76+j*80,440,x+89+j*80,440,C.orange)}part+=`<path data-line="boost-loss" d="M${x+15} 570 Q${x+75} 580 ${x+100} 540 T${x+245} 510" stroke="${C.orange}" stroke-width="4" fill="none"/>`;}if(i===3){for(let j=0;j<14;j++)part+=dot('svm-'+j,x+30+(j%4)*54,370+Math.floor(j/4)*56,j<7?C.gray:C.teal,7);part+=`<path data-line="svm-boundary" d="M${x+10} 570 Q${x+140} 520 ${x+145} 380 T${x+260} 350" stroke="${C.orange}" stroke-width="4" fill="none"/>`;}if(i===4){const pts=[[80,40],[155,30],[170,105],[80,150],[30,105],[230,35],[230,175],[35,215]];part+=`<circle cx="${x+115}" cy="460" r="100" fill="none" stroke="${C.orange}" stroke-dasharray="6 5" stroke-width="2"/>`;pts.forEach(([xx,yy],j)=>{if(j<5)part+=`<path data-knn-line="${j}" d="M${x+115} 460 L${x+xx} ${370+yy}" fill="none" stroke="${C.orange}" stroke-width="2"/>`;part+=dot('knn-'+j,x+xx,370+yy,j%2?C.teal:C.gray,j<5?10:7,j<5?`data-neighbor="${j}" stroke="${C.orange}" stroke-width="2"`:'')});part+=dot('knn-query',x+115,460,C.orange,12)}o+=`<g data-method="${i}" data-entrance="method-${i}">${part}</g>`});}
 else{o+=modelRank('cv')+t(1524,184,'Выбран: Gradient Boosting','label',C.orange,'end');}return o;}

 const m=D.models[k],chosen=m.name==='Gradient Boosting',best=m.name==='KNN',passed=m.test>.7;
 let panel=rect(100,233,640,564,'#FFFFFF',28)+t(140,302,m.name,'medium');

 panel+=t(855,285,chosen?'ВЫБРАН ПО CV':best?'ЛУЧШИЙ НА TEST':'F1 НА TEST','eyebrow',chosen?C.orange:best?C.teal:C.muted)+t(850,477,fmt(m.test),'big',chosen?C.orange:passed?C.teal:C.gray)+t(855,531,passed?'F1 > 0,70':'F1 ≤ 0,70','label',passed?C.teal:C.gray);
 ['Accuracy','Precision','Recall'].forEach((label,i)=>{let xx=855+i*219;panel+=t(xx,653,label,'small',C.muted)+t(xx,710,fmt(m.metrics[i]),'medium')});
 o+=`<g data-panel="method-${k}">${panel}</g>`;return o;}

function s8(k){let names=Object.keys(D.importance),name=names[k],values=D.importance[name];let o=base(7,'На что опирается модель',name);let sorted=Object.entries(values).sort((a,b)=>b[1]-a[1]);sorted.forEach(([f,v],i)=>{let y=310+i*61;o+=move('imp-'+f,0,y,t(79,7,f,'label',f==='Sex'?C.teal:C.ink)+rect(300,-22,1040,33,C.paper,4)+grow('imp-fill-'+f,300,-22,1040,33,v/.6,f==='Sex'?C.teal:C.orange)+t(300+1040*v/.6+17,6,fmt(v),'num',f==='Sex'?C.teal:C.ink))});o+=bottom('Важность — полезность для модели, а не вероятность выживания и не доказательство причинности.');return o;}
function errorChart(d){let o='';d.labels.forEach((l,i)=>{const y=320+i*62;o+=move('error-'+d.title+'-'+i,0,y,t(79,7,l,'label')+rect(340,-21,810,31,C.paper,4)+grow('error-fill-'+d.title+'-'+i,340,-21,810,31,d.rate[i]/.35,C.red)+t(340+810*d.rate[i]/.35+17,5,pct(d.rate[i]),'num',C.red)+t(1490,6,d.errors[i]+' из '+d.n[i],'small',C.muted,'end'))});return o;}
function human(key,x,y,color,fallen=false){let body=`<ellipse cx="${fallen?105:0}" cy="8" rx="${fallen?128:43}" ry="9" fill="#30282012"/>`;
 body+=`<g data-person="${key}" data-fall="${fallen}" style="transform:translateY(${fallen?-54:0}px) rotate(${fallen?90:0}deg)"><circle cx="0" cy="-224" r="29" fill="${color}"/><path d="M0 -178 L0 -88 M-69 -115 L0 -164 L69 -115 M0 -88 L-47 0 M0 -88 L47 0" stroke="${color}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>`;return move(key,x,y,body)}
function s9(k){let o=base(8,'Ошибки бустинга','Gradient Boosting');if(k===0){o+=t(80,412,'25','big',C.red)+t(80,476,'Пропущенные выжившие','label')+t(80,535,'FN · 36,2%','label',C.red)+t(920,412,'12','big',C.gray)+t(920,476,'Ложный прогноз выживания','label')+t(920,535,'FP · 10,9%','label',C.gray)+grow('fn-size',80,610,690,37,1,C.red)+grow('fp-size',920,610,690,37,12/25,C.gray)}
 else if(k<=3){const d=D.errors[k-1];o+=t(80,260,d.title,'medium')+t(1490,260,'ошибки / размер группы','small',C.muted,'end')+errorChart(d)}
 else{let ex=D.examples[k<6?0:1],reveal=k===5||k===7;o+=t(80,275,'№ '+ex.id,'medium')+t(80,320,ex.sex+' · '+ex.pclass+' класс','label',C.muted);o+=t(430,389,'Прогноз','label',C.muted,'middle')+human('prediction-'+ex.id,430,700,ex.pred?C.teal:C.gray,!ex.pred);if(reveal)o+=t(1050,389,'Факт','label',C.muted,'middle')+human('actual-'+ex.id,1050,700,ex.true?C.teal:C.red,!ex.true);o+=line(160,729,1460,729,C.pale)}return o;}

function s10(k){let o=base(9,'Три вывода','');let body='';
 if(k===0){const cx=405,cy=490,r=166;for(let i=0;i<5;i++){let a=-Math.PI/2+i*Math.PI*2/5+.04,b=a+Math.PI*2/5-.10;body+=`<path data-line="result-arc-${i}" d="M${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)} A${r} ${r} 0 0 1 ${cx+r*Math.cos(b)} ${cy+r*Math.sin(b)}" fill="none" stroke="${i<4?C.teal:C.pale}" stroke-width="21" stroke-linecap="round"/>`}
 body+=t(cx,522,'4 / 5','big',C.teal,'middle')+t(800,316,'F1 > 0,70','medium');['Random Forest','Gradient Boosting','SVM','KNN'].forEach((name,i)=>body+=`<g data-entrance="conclusion-model-${i}">${t(800,409+i*80,name,'medium')}</g>`);}
 if(k===1){body+=rect(80,269,680,452,C.paper,24)+rect(800,269,720,452,C.paper,24)+t(125,333,'ВЫБОР ПО CV','eyebrow',C.orange)+t(125,416,'Gradient Boosting','medium')+t(120,580,'0,753','big',C.orange)+t(125,644,'F1 · train CV','label',C.muted)+t(845,333,'ЛИДЕР TEST','eyebrow',C.teal)+t(845,416,'KNN','medium')+t(840,580,'0,750','big',C.teal)+t(845,644,'F1 · локальный test','label',C.muted);}
 if(k===2){body+=t(80,357,'Главная ошибка','medium')+t(80,448,'Пропуск выживших','title',C.red)+t(80,620,'25','big',C.red)+t(255,612,'выживших названы погибшими','label')+human('conclusion-person',1135,716,C.red,true)}
 return o+`<g data-conclusion="${k}">${body}</g>`;}
const renderers=[s1,s2,s3,s4,s5,s6,s7,s8,s9,s10];
const sections=[];
for(let i=0;i<10;i++){const el=document.createElement('section');el.className='slide';el.setAttribute('aria-label',(i+1)+'. '+titles[i]);el.dataset.slide=i+1;el.innerHTML=`<svg viewBox="0 0 1600 900" role="img" aria-label="${titles[i]}"></svg>`;$('#slides').append(el);sections.push(el)}
const defs=`<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="${C.orange}" stroke-width="1.5"/></marker></defs>`;
const EASE='cubic-bezier(.22,.68,.12,1)',SLOW=1350;
let direction=1;
function animateElement(el,frames,options={}){return el.animate(frames,{duration:SLOW,easing:EASE,fill:'backwards',...options})}
function textKey(el){return [el.getAttribute('x'),el.getAttribute('y'),el.getAttribute('text-anchor'),el.textContent].join('|')}
function draw(animate=true,k=step){const section=sections[slide],svg=section.querySelector('svg'),previous=new Map(),texts=new Set([...svg.querySelectorAll('text')].map(textKey)),entrances=new Set([...svg.querySelectorAll('[data-entrance]')].map(el=>el.dataset.entrance)),people=new Set([...svg.querySelectorAll('[data-person]')].map(el=>el.dataset.person));
 const previousPanel=svg.querySelector('[data-panel]'),outgoing=previousPanel?.cloneNode(true),oldPanelKey=previousPanel?.dataset.panel;
 svg.querySelectorAll('[data-motion]').forEach(el=>previous.set(el.dataset.motion,{transform:getComputedStyle(el).transform,fill:el.firstElementChild?getComputedStyle(el.firstElementChild).fill:null}));
 svg.innerHTML=defs+renderers[slide](k);section.dataset.step=k;
 if(!animate||reduce.matches)return svg;
 const panel=svg.querySelector('[data-panel]'),panelChanges=panel&&oldPanelKey!==panel.dataset.panel;
 svg.querySelectorAll('[data-motion]').forEach((el,j)=>{const old=previous.get(el.dataset.motion),from=old?.transform,to=el.style.transform,child=el.firstElementChild,newFill=child?getComputedStyle(child).fill:null,key=el.dataset.motion;
 if(old?.fill&&newFill&&old.fill!==newFill){const wave=key.startsWith('all-')?Math.max(0,+key.slice(4)-549)*4:key.startsWith('baseline-')?Math.max(0,+key.slice(9)-110)*10:j%12*28;animateElement(child,[{fill:old.fill},{fill:newFill}],{duration:1250,delay:wave})}
 if(key==='median-value'&&slide===3&&k===2){animateElement(el,[{transform:from,offset:0},{transform:'translate(595px,290px)',offset:.28},{transform:'translate(420px,715px)',offset:.82},{transform:to,offset:1}],{duration:1650});return}
 let frames=null,delay=key.startsWith('split-')?(+key.slice(6)%25)*12:0;
 if(old&&from!=='none'&&from!==to)frames=[{transform:from},{transform:to}];
 else if(!old){if(key.endsWith('-bar'))frames=[{transform:to.startsWith('scaleY')?'scaleY(0)':'scaleX(0)'},{transform:to}];else if(key.startsWith('rank-number-'))frames=[{transform:'translate(436px,4px)',opacity:0},{transform:to,opacity:1}];else frames=[{opacity:0},{opacity:1}];}
 if(frames)animateElement(el,frames,{delay,duration:key.includes('rank-')?1700:SLOW});
 });
 svg.querySelectorAll('text').forEach((el,j)=>{if(!texts.has(textKey(el)))animateElement(el,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'translateY(0px)'}],{duration:1050,delay:j%7*32})});
 svg.querySelectorAll('[data-entrance]').forEach(el=>{if(!entrances.has(el.dataset.entrance))animateElement(el,[{opacity:0,transform:'translateY(75px)'},{opacity:1,transform:'translateY(0px)'}],{duration:1400,delay:el.dataset.entrance.startsWith('conclusion')?+el.dataset.entrance.slice(-1)*170:0})});
 svg.querySelectorAll('[data-line]').forEach((el,i)=>{if(slide===5&&k<5&&el.closest('[data-method]')?.dataset.method!==String(k))return;const len=el.getTotalLength();animateElement(el,[{strokeDasharray:len,strokeDashoffset:len},{strokeDasharray:len,strokeDashoffset:0}],{duration:1350,delay:i%7*65})});
 svg.querySelectorAll('[data-knn-line]').forEach((el,i)=>{const len=el.getTotalLength();animateElement(el,[{strokeDasharray:len,strokeDashoffset:len,opacity:0},{strokeDasharray:len,strokeDashoffset:0,opacity:1}],{duration:850,delay:700+i*300})});
 svg.querySelectorAll('[data-neighbor]').forEach((el,i)=>animateElement(el,[{opacity:0,r:4},{opacity:1,r:10}],{duration:650,delay:550+i*300}));
 svg.querySelectorAll('[data-cell]').forEach((el,i)=>animateElement(el,[{opacity:0,transform:'translateX(-1000px)',offset:0},{opacity:1,transform:'translateX(-1000px)',offset:.08},{opacity:1,transform:'translateX(0px)',offset:1}],{duration:400,delay:1450+i*425}));
 svg.querySelectorAll('[data-frame]').forEach(el=>animateElement(el,[{opacity:0},{opacity:1}],{delay:1400,duration:800}));
 svg.querySelectorAll('[data-person]').forEach(el=>{if(!people.has(el.dataset.person)&&el.dataset.fall==='true')animateElement(el,[{transform:'translateY(0px) rotate(0deg)',offset:0},{transform:'translateY(-5px) rotate(-7deg)',offset:.25},{transform:'translateY(-58px) rotate(92deg)',offset:.84},{transform:'translateY(-54px) rotate(90deg)',offset:1}],{duration:1750,delay:220})});
 const conclusion=svg.querySelector('[data-conclusion]');if(conclusion)animateElement(conclusion,[{opacity:0,transform:'translateY(55px)'},{opacity:1,transform:'translateY(0px)'}],{duration:1450});
 if(panelChanges){animateElement(panel,[{transform:`translateX(${direction*1700}px)`,opacity:.25},{transform:'translateX(0px)',opacity:1}],{duration:1450,delay:outgoing?180:0});if(outgoing){outgoing.dataset.outgoing='true';svg.append(outgoing);animateElement(outgoing,[{transform:'translateX(0px)',opacity:1},{transform:`translateX(${-direction*1700}px)`,opacity:0}],{duration:1250,fill:'forwards'}).finished.then(()=>outgoing.remove()).catch(()=>{})}}
 return svg;}
function go(s,k=0,animate=true){clearTimeout(replayTimer);const old=slide*100+step;slide=Math.max(0,Math.min(9,s));step=Math.max(0,Math.min(steps[slide]-1,k));direction=slide*100+step>=old?1:-1;sections.forEach((el,i)=>{el.classList.toggle('active',i===slide);el.setAttribute('aria-hidden',String(i!==slide));el.inert=i!==slide});draw(animate);$('#live').textContent='Слайд '+(slide+1)+'. '+titles[slide]+'. Шаг '+(step+1);history.replaceState(null,'','#'+(slide+1)+'.'+step)}
function next(){if(step<steps[slide]-1)go(slide,step+1);else if(slide<9)go(slide+1,0)}
function prev(){if(step>0)go(slide,step-1);else if(slide>0)go(slide-1,steps[slide-1]-1)}
function replay(){clearTimeout(replayTimer);if(reduce.matches){draw(false);return}if(step){draw(false,step-1);replayTimer=setTimeout(()=>draw(true),60)}else{sections[slide].querySelector('svg').innerHTML='';draw(true)}}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#live').textContent='Полный экран недоступен в этом браузере.'}}
function action(target){const a=target.closest('[data-action]');if(!a)return false;const v=a.dataset.action;if(v.startsWith('step:'))go(slide,+v.slice(5));return true}
$('#slides').addEventListener('click',e=>{if(!action(e.target))next()});$('#slides').addEventListener('contextmenu',e=>{e.preventDefault();prev()});$('#slides').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-action]')){e.preventDefault();e.stopPropagation();action(e.target)}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const key=e.key;if(['ArrowRight','PageDown',' '].includes(key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(key)){e.preventDefault();prev()}else if(key==='Home'){e.preventDefault();go(0,0)}else if(key==='End'){e.preventDefault();go(9,steps[9]-1)}else if(/^[0-9]$/.test(key)){go(key==='0'?9:+key-1,0)}else if(key.toLowerCase()==='r')replay();else if(key.toLowerCase()==='f')fullscreen()});
function fit(){const scale=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform=`translate(-50%,-50%) scale(${scale})`}
window.addEventListener('resize',fit);fit();
function readHash(){const match=location.hash.match(/^#(\d+)\.(\d+)$/);if(match)go(+match[1]-1,+match[2],false);else go(0,0,false)}window.addEventListener('hashchange',readHash);readHash();
let touchX=null;document.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>70){if(dx<0)next();else prev()}touchX=null},{passive:true});
window.deck={go,next,prev,replay,get state(){return {slide,step}},steps,data:D};
</script></body></html>
